[files]
extend-exclude = ["dot-config/ghostty/shaders"]

[default]
extend-ignore-re = [
  # Intentional Vim typo-expansion abbreviations, e.g. `abbr funciton function`.
  '''\babbr\s+\w+\s+\w+''',
  # Intentional Neovim typo-expansion abbreviations, e.g. `vim.cmd("abbr funciton function")`.
  '''vim\.cmd\("abbr\s+\w+\s+\w+"\)''',
  # Intentional shell aliases for common `python` misspellings.
  '''alias py(?:tohn|hton)=['"]python['"]''',
  # Intentional ptpython correction-map entries, e.g. `"pritn": "print"`.
  '''"(?:impotr|pritn)":\s*"(?:import|print)"''',
  # Neovim keybinding, not prose.
  '''"<leader>fo"''',
  # YouTube feed title.
  '''"ARTEde"''',
  # macOS release name.
  '''Big Sur''',
]
